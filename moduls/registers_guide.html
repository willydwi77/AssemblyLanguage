    }
  ];

  /* --- RENDERERS --- */
  function generateRegDiagram(arch, args) {
    if(!args) return '';
    let is_x86 = (arch === 'x86');
    let name_64, name_32, name_16, name_8h, name_8l;
    if (is_x86) { [name_32, name_16, name_8h, name_8l] = args; } 
    else { [name_64, name_32, name_16, name_8h, name_8l] = args; }

    let html = `<div class="font-semibold text-slate-800 text-[13px] mb-2 mt-4 border-b border-slate-100 pb-1">Tata Letak Bit (${is_x86 ? '32-bit x86' : '64-bit x64'})</div><div class="reg-diagram">`;
    if (!is_x86) html += `<div class="reg-row"><div class="reg-label">${name_64}</div><div class="reg-bits"><div class="bit-block bit-64 flex-1 text-[10px]">64-bit (${name_64})</div></div></div>`;
    
    html += `<div class="reg-row"><div class="reg-label">${name_32}</div><div class="reg-bits">`;
    if (!is_x86) html += `<div class="bit-block bit-inactive flex-1">Upper 32</div>`;
    html += `<div class="bit-block bit-32 flex-1 text-[10px]">32-bit (${name_32})</div></div></div>`;

    html += `<div class="reg-row"><div class="reg-label">${name_16}</div><div class="reg-bits">`;
    if (!is_x86) html += `<div class="bit-block bit-inactive flex-1" style="flex:3">Upper 48</div>`;
    else html += `<div class="bit-block bit-inactive flex-1">Upper 16</div>`;
    html += `<div class="bit-block bit-16 flex-1 text-[10px]">16-bit (${name_16})</div></div></div>`;

    if (name_8l) {
      html += `<div class="reg-row"><div class="reg-label">${name_8h ? name_8h+'/'+name_8l : name_8l}</div><div class="reg-bits">`;
      if (!is_x86) html += `<div class="bit-block bit-inactive flex-1" style="flex:${name_8h ? 6 : 7}">Ignored</div>`;
      else html += `<div class="bit-block bit-inactive flex-1" style="flex:${name_8h ? 2 : 3}">Ignored</div>`;
      if (name_8h) html += `<div class="bit-block bit-8 flex-1 text-[9px] bg-pink-500">${name_8h}</div>`;
      html += `<div class="bit-block bit-8 flex-1 text-[9px]">${name_8l}</div></div></div>`;
    }
    return html + `</div>`;
  }

  function renderOpcodes(ops) {
    if(!ops) return '';
    const rows = ops.map(o => `<tr class="border-b border-slate-100"><td class="py-1.5 px-2 font-mono font-bold text-blue-700 whitespace-nowrap">${o[0]}</td><td class="py-1.5 px-2 font-mono text-orange-600 whitespace-nowrap">${o[1]}</td><td class="py-1.5 px-2 text-slate-600">${o[2]}</td></tr>`).join('');
    return `<table class="op-table"><thead><tr><th>Instruksi Assembly</th><th>Mesin (Hex)</th><th>Keterangan Aksi</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderAnimUI(id, data) {
    if(!data) return '';
    const codeHtml = data.code.map((line, i) => `<div id="anim-${id}-line-${i}" class="anim-line font-mono text-[11px]">${line}</div>`).join('');
    const regsHtml = data.regs.map((reg, i) => `<div class="flex justify-between items-center bg-white border border-slate-200 px-3 py-1.5 rounded shadow-sm"><span class="font-bold text-slate-500 text-[11px]">${reg}</span><span id="anim-${id}-val-${i}" class="font-mono text-[13px] text-blue-700 font-bold transition-all duration-300">0</span></div>`).join('');
    return `
      <div class="border border-slate-300 rounded-lg bg-slate-50 overflow-hidden shadow-sm mt-6 anim-player" data-anim="${id}">
        <div class="bg-slate-200 px-3 py-2 border-b border-slate-300 flex justify-between items-center">
          <div class="font-bold text-[13px] text-slate-800">Animasi Dinamis: ${data.title}</div>
        </div>
        <div class="p-3 flex flex-col md:flex-row gap-4">
           <div class="flex-1 bg-slate-900 text-slate-300 py-2 rounded shadow-inner overflow-x-auto">${codeHtml}</div>
           <div class="w-full md:w-[40%] flex flex-col gap-1.5 justify-center">${regsHtml}</div>
        </div>
        <div class="bg-slate-100 border-t border-slate-200 px-3 py-2 flex gap-2">
           <button onclick="stepAnim('${id}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold rounded shadow transition-colors flex items-center gap-1">Langkah ⏭️</button>
           <button onclick="resetAnim('${id}')" class="px-3 py-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-[11px] font-bold rounded shadow-sm transition-colors">Reset 🔄</button>
        </div>
      </div>`;
  }

  function renderApp() {
    ['gpr','ptr','seg'].forEach(g => document.getElementById(`${g}-content`).innerHTML = '');
    let firstGroupFlags = { gpr: true, ptr: true, seg: true };

    for (let key in db) {
      let reg = db[key];
      
      let d_title = archData(reg.title);
      let d_desc = archData(reg.desc);
      let d_diagArgs = archData(reg.diagArgs);
      let d_cpp = archData(reg.cpp);
      let d_asm = archData(reg.asm);
      let d_opcodes = archData(reg.opcodes);
      let d_anim = archData(reg.anim);
      let d_info = archData(reg.info);
      let d_warn = archData(reg.warn);
      let d_html = archData(reg.html);

      let tabBtn = document.getElementById(`tab-btn-${key}`);
      if(tabBtn) tabBtn.innerText = d_title;

      let isFirst = firstGroupFlags[reg.group];
      firstGroupFlags[reg.group] = false;

      let htmlContent = `
        <div id="reg-${key}" class="card ${isFirst ? '' : 'hidden'}" data-group="${reg.group}">
          <div class="flex items-center gap-3 mb-2"><h2 class="section-title mb-0">${d_title}</h2><span class="badge ${reg.badge}">${archData(reg.badgeText)}</span></div>
          <p class="content-desc">${d_desc}</p>
          ${d_diagArgs ? generateRegDiagram(currentArch, d_diagArgs) : ''}
          ${d_html ? d_html : ''}
          ${(d_info || d_warn) ? `
          <div class="flex flex-col md:flex-row gap-4 mt-5">
            ${d_info ? `<div class="info-box flex-1"><div class="font-bold mb-1 text-[13px] text-blue-800">📌 Info / Kapan Digunakan:</div><ul class="list-disc pl-4 mt-1 space-y-1">${d_info.map(i=>`<li>${i}</li>`).join('')}</ul></div>` : ''}
            ${d_warn ? `<div class="warn-box flex-1"><div class="font-bold mb-1 text-[13px] text-amber-700">⚠️ Peringatan Tambahan:</div><ul class="list-disc pl-4 mt-1 space-y-1">${d_warn.map(i=>`<li>${i}</li>`).join('')}</ul></div>` : ''}
          </div>` : ''}
          ${(d_cpp && d_asm) ? `
          <div class="flex flex-col lg:flex-row gap-4 mt-5">
            <div class="flex-1 border border-slate-200 rounded overflow-hidden flex flex-col">
               <div class="bg-slate-100 px-3 py-1.5 text-[11px] font-bold text-slate-600 border-b border-slate-200 flex justify-between items-center">
                 <span>Kode Level Tinggi (C/C++)</span>
                 <a href="https://playcode.io/cpp-playground" target="_blank" class="text-blue-600 hover:text-blue-800 hover:bg-blue-100 flex items-center gap-1 font-normal bg-blue-50 px-2 py-0.5 rounded border border-blue-200 shadow-sm transition-colors">Playcode ↗</a>
               </div>
               <pre class="code-block h-full"><code>${d_cpp}</code></pre>
            </div>
            <div class="flex-1 border border-slate-200 rounded overflow-hidden flex flex-col">
               <div class="bg-slate-100 px-3 py-1.5 text-[11px] font-bold text-slate-600 border-b border-slate-200 flex justify-between items-center">
                 <span>Bahasa Mesin & Assembly</span>
                 <a href="https://app.x64.halb.it/" target="_blank" class="text-blue-600 hover:text-blue-800 hover:bg-blue-100 flex items-center gap-1 font-normal bg-blue-50 px-2 py-0.5 rounded border border-blue-200 shadow-sm transition-colors">Halb.it ↗</a>
               </div>
               <pre class="code-block dark h-full"><code>${d_asm}</code></pre>
            </div>
          </div>` : ''}
          
          ${d_opcodes ? `
          <div class="mt-5 border border-slate-200 rounded-lg overflow-x-auto w-full">
             ${renderOpcodes(d_opcodes)}
          </div>` : ''}

          ${renderAnimUI(key, d_anim)}
        </div>
      `;
      document.getElementById(`${reg.group}-content`).innerHTML += htmlContent;
    }

    let fnHtml = '<h2 class="section-title mb-4">Catatan Kaki Ekstra</h2>';
    footnotes.forEach((fn, i) => {
      let fTitle = archData(fn.title);
      let fText = archData(fn.text);
      fnHtml += `<div class="footnote-item"><div class="footnote-num">${i+1}</div><div><b class="text-slate-800">${fTitle}</b><br><span class="text-slate-500 mt-1 block">${fText}</span></div></div>`;
    });
    document.getElementById('ftn-content').innerHTML = fnHtml;

    document.querySelectorAll('.anim-player').forEach(el => { el.currentStep = 0; updateAnimUI(el.dataset.anim, 0); });
  }

  /* --- ANIMATION LOGIC --- */
  window.stepAnim = function(id) {
    const el = document.querySelector(`[data-anim="${id}"]`);
    const data = archData(db[id].anim);
    el.currentStep = (el.currentStep + 1) % data.steps.length;
    updateAnimUI(id, el.currentStep);
  };
  window.resetAnim = function(id) {
    const el = document.querySelector(`[data-anim="${id}"]`);
    el.currentStep = 0;
    updateAnimUI(id, 0);
  };
  function updateAnimUI(id, stepIndex) {
    const data = archData(db[id].anim);
    const step = data.steps[stepIndex];
    data.code.forEach((_, i) => {
      const lineEl = document.getElementById(`anim-${id}-line-${i}`);
      if(i === step.l) lineEl.classList.add('active');
      else lineEl.classList.remove('active');
    });
    step.v.forEach((val, i) => {
      const valEl = document.getElementById(`anim-${id}-val-${i}`);
      if(valEl.innerText !== val) {
        valEl.innerText = val;
        valEl.classList.add('anim-val-change');
        setTimeout(() => valEl.classList.remove('anim-val-change'), 300);
      }
    });
  }

  /* --- TABS LOGIC --- */
  window.switchMainGroup = function(groupId, btn) {
    ['gpr','ptr','seg','ftn'].forEach(g => {
      document.getElementById('group-' + g).classList.toggle('hidden', g !== groupId);
    });
    setActiveTabUI(btn);
  };

  window.switchSubReg = function(regId, groupId, btn) {
    document.querySelectorAll(`#${groupId}-content > .card`).forEach(c => c.classList.add('hidden'));
    document.getElementById('reg-' + regId).classList.remove('hidden');
    setActiveTabUI(btn);
  };

  /* --- BOOTSTRAP --- */
  renderApp();

</script>
</body>
</html>
