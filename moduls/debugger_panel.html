<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* ========================================================
       Debugger Panel Component Styles (Reusable)
       ======================================================== */
    .anim-panel-container {
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid #333333;
    }
    .anim-panel-header {
      background-color: #252526;
      border-bottom: 1px solid #333333;
      padding: 6px 10px;
      color: #e8e8e8;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .anim-panel-border-r { border-right: 1px solid #333333; }
    .anim-panel-border-b { border-bottom: 1px solid #333333; }
    
    /* Scrollbars Customization */
    .anim-panel-container ::-webkit-scrollbar { width: 10px; height: 10px; }
    .anim-panel-container ::-webkit-scrollbar-track { background: #1e1e1e; }
    .anim-panel-container ::-webkit-scrollbar-thumb { background: #424242; border: 1px solid #1e1e1e; }
    .anim-panel-container ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
    
    /* Syntax Highlighting */
    .hl-reg { color: #569cd6; }
    .hl-val { color: #d4d4d4; }
    .hl-addr { color: #858585; }
    .hl-bytes { color: #9cdcfe; margin: 0 8px; }
    .hl-inst { color: #d4d4d4; }
    .hl-term { color: #d4d4d4; }
    .hl-term-prompt { color: #569cd6; font-weight: bold; }
    
    /* Source Code lines */
    .anim-panel-code .anim-line {
      display: flex;
      padding-right: 8px;
      cursor: default;
      line-height: 1.6;
    }
    .anim-panel-code .anim-line.active {
      background-color: #37373d;
    }
    .anim-panel-code .anim-line-num {
      color: #858585;
      width: 32px;
      text-align: right;
      padding-right: 10px;
      margin-right: 10px;
      border-right: 1px solid #404040;
      user-select: none;
    }
  </style>
</head>
<body class="p-8 bg-slate-100">

  <div class="max-w-6xl mx-auto">
    <h2 class="text-xl font-bold mb-4 text-slate-800">Uji Coba Komponen Animasi (Debugger View)</h2>
    
    <!-- Animasi Controller Header -->
    <div class="bg-slate-800 text-white px-4 py-3 rounded-t-lg flex justify-between items-center shadow-sm">
      <div class="font-bold text-sm">Simulasi Eksekusi: Hello World</div>
      <div class="flex items-center gap-3">
        <label class="text-xs text-slate-300">Arsitektur:</label>
        <select id="sim-mode" onchange="changeSimMode(this.value)" class="bg-slate-700 text-xs px-2 py-1 rounded border-none outline-none text-white">
          <option value="x64">x64 (64-bit)</option>
          <option value="x86">x86 (32-bit)</option>
        </select>
      </div>
    </div>

    <!-- KOMPONEN UTAMA REUSABLE -->
    <div class="anim-panel-container flex flex-col md:flex-row h-[600px] !rounded-t-none border-t-0">
      
      <!-- Kiri: Code -->
      <div class="flex-[1.2] flex flex-col anim-panel-border-r">
        <div class="anim-panel-header">Source Code</div>
        <div class="anim-panel-code flex-1 overflow-auto py-2" id="anim-code-view">
          <!-- Generated by JS -->
        </div>
      </div>
      
      <!-- Kanan: Dashboard grids -->
      <div class="flex-[2] flex flex-col">
        <!-- Top Row -->
        <div class="flex flex-1 anim-panel-border-b overflow-hidden">
          <div class="flex-1 flex flex-col anim-panel-border-r">
            <div class="anim-panel-header">Registers</div>
            <div class="flex-1 overflow-auto p-2" id="anim-regs-view"></div>
          </div>
          <div class="flex-[1.5] flex flex-col">
            <div class="anim-panel-header">Disassembly</div>
            <div class="flex-1 overflow-auto p-2 whitespace-nowrap" id="anim-disasm-view"></div>
          </div>
        </div>
        <!-- Bottom Row -->
        <div class="flex flex-1 overflow-hidden">
          <div class="flex-[1.5] flex flex-col anim-panel-border-r">
            <div class="anim-panel-header">Stack memory</div>
            <div class="flex-1 overflow-auto p-2 whitespace-nowrap" id="anim-stack-view"></div>
          </div>
          <div class="flex-1 flex flex-col">
            <div class="anim-panel-header">Terminal</div>
            <div class="flex-1 overflow-auto p-2" id="anim-term-view"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls -->
    <div class="bg-white border border-slate-300 border-t-0 px-4 py-3 rounded-b-lg flex gap-2 shadow-sm">
      <button onclick="stepAnim()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded shadow transition-colors flex items-center gap-1">Langkah Selanjutnya ⏭️</button>
      <button onclick="resetAnim()" class="px-5 py-2 bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 text-xs font-bold rounded shadow-sm transition-colors">Ulangi 🔄</button>
    </div>
  </div>

  <script>
    let currentMode = 'x64';
    let currentStep = 0;

    const dummyData = {
      x64: {
        code: [
          "; Windows x64 ABI",
          "extern printf",
          "section .data",
          "  msg db 'Hello', 0",
          "section .text",
          "global main",
          "main:",
          "  sub rsp, 32         ; 1. Shadow Space",
          "  lea rcx, [rel msg]  ; 2. Argumen 1",
          "  call printf         ; 3. Panggil",
          "  add rsp, 32         ; 4. Cleanup",
          "  ret"
        ],
        steps: [
          {
            l: 7,
            regs: { "rax": "0x00", "rbx": "0x00", "rcx": "0x00", "rdx": "0x00", "rbp": "0x00", "rsp": "0x00007FFFFFFFE000", "rsi": "0x00", "rdi": "0x00", "rflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "48 83 ec 20", inst: "sub rsp, 0x20", active: true },
              { addr: "004000b4", bytes: "48 8d 0d 45...", inst: "lea rcx, [rip+0x402000]", active: false },
              { addr: "004000bb", bytes: "e8 00 00 00...", inst: "call printf", active: false },
              { addr: "004000c0", bytes: "48 83 c4 20", inst: "add rsp, 0x20", active: false },
              { addr: "004000c4", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00007FFFFFFFE000", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program\n"
          },
          {
            l: 8,
            regs: { "rax": "0x00", "rbx": "0x00", "rcx": "0x00", "rdx": "0x00", "rbp": "0x00", "rsp": "0x00007FFFFFFFDFE0", "rsi": "0x00", "rdi": "0x00", "rflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "48 83 ec 20", inst: "sub rsp, 0x20", active: false },
              { addr: "004000b4", bytes: "48 8d 0d 45...", inst: "lea rcx, [rip+0x402000]", active: true },
              { addr: "004000bb", bytes: "e8 00 00 00...", inst: "call printf", active: false },
              { addr: "004000c0", bytes: "48 83 c4 20", inst: "add rsp, 0x20", active: false },
              { addr: "004000c4", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00007FFFFFFFE000", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program\n"
          },
          {
            l: 9,
            regs: { "rax": "0x00", "rbx": "0x00", "rcx": "0x0000000000402000", "rdx": "0x00", "rbp": "0x00", "rsp": "0x00007FFFFFFFDFE0", "rsi": "0x00", "rdi": "0x00", "rflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "48 83 ec 20", inst: "sub rsp, 0x20", active: false },
              { addr: "004000b4", bytes: "48 8d 0d 45...", inst: "lea rcx, [rip+0x402000]", active: false },
              { addr: "004000bb", bytes: "e8 00 00 00...", inst: "call printf", active: true },
              { addr: "004000c0", bytes: "48 83 c4 20", inst: "add rsp, 0x20", active: false },
              { addr: "004000c4", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00007FFFFFFFE000", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program\n<span class='hl-term'>Hello</span>\n"
          },
          {
            l: 10,
            regs: { "rax": "0x06", "rbx": "0x00", "rcx": "0x0000000000402000", "rdx": "0x00", "rbp": "0x00", "rsp": "0x00007FFFFFFFDFE0", "rsi": "0x00", "rdi": "0x00", "rflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "48 83 ec 20", inst: "sub rsp, 0x20", active: false },
              { addr: "004000b4", bytes: "48 8d 0d 45...", inst: "lea rcx, [rip+0x402000]", active: false },
              { addr: "004000bb", bytes: "e8 00 00 00...", inst: "call printf", active: false },
              { addr: "004000c0", bytes: "48 83 c4 20", inst: "add rsp, 0x20", active: true },
              { addr: "004000c4", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00007FFFFFFFE000", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program\n<span class='hl-term'>Hello</span>\n"
          },
          {
            l: 11,
            regs: { "rax": "0x06", "rbx": "0x00", "rcx": "0x0000000000402000", "rdx": "0x00", "rbp": "0x00", "rsp": "0x00007FFFFFFFE000", "rsi": "0x00", "rdi": "0x00", "rflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "48 83 ec 20", inst: "sub rsp, 0x20", active: false },
              { addr: "004000b4", bytes: "48 8d 0d 45...", inst: "lea rcx, [rip+0x402000]", active: false },
              { addr: "004000bb", bytes: "e8 00 00 00...", inst: "call printf", active: false },
              { addr: "004000c0", bytes: "48 83 c4 20", inst: "add rsp, 0x20", active: false },
              { addr: "004000c4", bytes: "c3", inst: "ret", active: true }
            ],
            stack: [
              { addr: "00007FFFFFFFE000", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFF0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE8", bytes: "00 00 00 00 00 00 00 00", ascii: "........" },
              { addr: "00007FFFFFFFDFE0", bytes: "00 00 00 00 00 00 00 00", ascii: "........" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program\n<span class='hl-term'>Hello</span>\n[Process exited with code 0]"
          }
        ]
      },
      x86: {
        code: [
          "; Windows x86 ABI (CDECL)",
          "extern printf",
          "section .data",
          "  msg db 'Hello', 0",
          "section .text",
          "global main",
          "main:",
          "  push msg            ; 1. Argumen 1",
          "  call printf         ; 2. Panggil",
          "  add esp, 4          ; 3. Cleanup Stack",
          "  ret"
        ],
        steps: [
          {
            l: 7,
            regs: { "eax": "0x00", "ebx": "0x00", "ecx": "0x00", "edx": "0x00", "ebp": "0x00", "esp": "0x00402000", "esi": "0x00", "edi": "0x00", "eflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "68 00 20 40 00", inst: "push 0x402000", active: true },
              { addr: "004000b5", bytes: "e8 00 00 00 00", inst: "call printf", active: false },
              { addr: "004000ba", bytes: "83 c4 04", inst: "add esp, 4", active: false },
              { addr: "004000bd", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00402000", bytes: "00 00 00 00", ascii: "...." },
              { addr: "00401FFC", bytes: "00 00 00 00", ascii: "...." }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program_x86\n"
          },
          {
            l: 8,
            regs: { "eax": "0x00", "ebx": "0x00", "ecx": "0x00", "edx": "0x00", "ebp": "0x00", "esp": "0x00401FFC", "esi": "0x00", "edi": "0x00", "eflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "68 00 20 40 00", inst: "push 0x402000", active: false },
              { addr: "004000b5", bytes: "e8 00 00 00 00", inst: "call printf", active: true },
              { addr: "004000ba", bytes: "83 c4 04", inst: "add esp, 4", active: false },
              { addr: "004000bd", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00402000", bytes: "00 00 00 00", ascii: "...." },
              { addr: "00401FFC", bytes: "00 20 40 00", ascii: ". @" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program_x86\n<span class='hl-term'>Hello</span>\n"
          },
          {
            l: 9,
            regs: { "eax": "0x06", "ebx": "0x00", "ecx": "0x00", "edx": "0x00", "ebp": "0x00", "esp": "0x00401FFC", "esi": "0x00", "edi": "0x00", "eflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "68 00 20 40 00", inst: "push 0x402000", active: false },
              { addr: "004000b5", bytes: "e8 00 00 00 00", inst: "call printf", active: false },
              { addr: "004000ba", bytes: "83 c4 04", inst: "add esp, 4", active: true },
              { addr: "004000bd", bytes: "c3", inst: "ret", active: false }
            ],
            stack: [
              { addr: "00402000", bytes: "00 00 00 00", ascii: "...." },
              { addr: "00401FFC", bytes: "00 20 40 00", ascii: ". @" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program_x86\n<span class='hl-term'>Hello</span>\n"
          },
          {
            l: 10,
            regs: { "eax": "0x06", "ebx": "0x00", "ecx": "0x00", "edx": "0x00", "ebp": "0x00", "esp": "0x00402000", "esi": "0x00", "edi": "0x00", "eflags": "[ ZF=0 SF=0 ]" },
            disasm: [
              { addr: "004000b0", bytes: "68 00 20 40 00", inst: "push 0x402000", active: false },
              { addr: "004000b5", bytes: "e8 00 00 00 00", inst: "call printf", active: false },
              { addr: "004000ba", bytes: "83 c4 04", inst: "add esp, 4", active: false },
              { addr: "004000bd", bytes: "c3", inst: "ret", active: true }
            ],
            stack: [
              { addr: "00402000", bytes: "00 00 00 00", ascii: "...." },
              { addr: "00401FFC", bytes: "00 20 40 00", ascii: ". @" }
            ],
            term: "<span class='hl-term-prompt'>$</span> /program_x86\n<span class='hl-term'>Hello</span>\n[Process exited with code 0]"
          }
        ]
      }
    };

    function updateAnimUI() {
      const data = dummyData[currentMode];
      const step = data.steps[currentStep];

      // 1. Code Panel
      let codeHtml = data.code.map((line, i) => {
        let isActive = (i === step.l);
        return `<div class="anim-line ${isActive ? 'active' : ''}">
                  <div class="anim-line-num">${i + 1}</div>
                  <div class="flex-1 whitespace-pre">${line}</div>
                </div>`;
      }).join('');
      document.getElementById('anim-code-view').innerHTML = codeHtml;

      // 2. Registers
      let regsHtml = '';
      for (const [reg, val] of Object.entries(step.regs)) {
        regsHtml += `<div><span class="hl-reg">${reg.padEnd(5, ' ')}</span> : <span class="hl-val">${val}</span></div>`;
      }
      document.getElementById('anim-regs-view').innerHTML = `<pre class="m-0 whitespace-pre">${regsHtml}</pre>`;

      // 3. Disassembly
      let disasmHtml = step.disasm.map(d => {
        let bgClass = d.active ? 'bg-[#37373d]' : '';
        return `<div class="flex ${bgClass} py-0.5">
                  <div class="hl-addr w-[65px]">${d.addr}</div>
                  <div class="hl-bytes w-[85px] whitespace-nowrap overflow-hidden text-ellipsis">${d.bytes}</div>
                  <div class="hl-inst flex-1">${d.inst}</div>
                </div>`;
      }).join('');
      document.getElementById('anim-disasm-view').innerHTML = disasmHtml;

      // 4. Stack
      let stackHtml = step.stack.map(s => {
        return `<div class="flex py-0.5">
                  <div class="hl-addr w-[130px] text-right">${s.addr}</div>
                  <div class="hl-bytes flex-1">${s.bytes}</div>
                  <div class="hl-addr">${s.ascii}</div>
                </div>`;
      }).join('');
      document.getElementById('anim-stack-view').innerHTML = stackHtml;

      // 5. Terminal
      document.getElementById('anim-term-view').innerHTML = `<pre class="m-0 whitespace-pre-wrap">${step.term}</pre>`;
    }

    window.stepAnim = function() {
      const data = dummyData[currentMode];
      currentStep = (currentStep + 1) % data.steps.length;
      updateAnimUI();
    };

    window.resetAnim = function() {
      currentStep = 0;
      updateAnimUI();
    };

    window.changeSimMode = function(mode) {
      currentMode = mode;
      resetAnim();
    };

    // Bootstrap
    resetAnim();
  </script>
</body>
</html>
